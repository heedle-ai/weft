<svg xmlns="http://www.w3.org/2000/svg" width="680" height="360" viewBox="0 0 680 360" role="img"><title>Composing arrows in weft</title><desc>Three panels. Compose: one wire through f then g. Par: two wires side by side through f and g. Sum: an Either input routed to f or g, joining into one output.</desc><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.w{stroke:#5F5E5A;stroke-width:1.5;fill:none}.dot{fill:#5F5E5A}
.d{stroke:#888780;stroke-width:0.8;fill:none;stroke-dasharray:5 4}
.l{font-size:12px;fill:#5F5E5A}.f{font-size:13px;fill:#444441}
.t1{font-size:14px;font-weight:600}.t2{font-size:12px}
.p rect{fill:#EEEDFE;stroke:#534AB7}.p .t1{fill:#3C3489}.p .t2{fill:#534AB7}
.g rect{fill:#E1F5EE;stroke:#0F6E56}.g .t1{fill:#085041}.g .t2{fill:#0F6E56}
.c rect{fill:#FAECE7;stroke:#993C1D}.c .t1{fill:#712B13}.c .t2{fill:#993C1D}
.n rect{fill:#F1EFE8;stroke:#5F5E5A}.n .t1{fill:#444441}.n .t2{fill:#5F5E5A}
@media (prefers-color-scheme:dark){
.w{stroke:#B4B2A9}.dot{fill:#B4B2A9}.d{stroke:#888780}.l{fill:#B4B2A9}.f{fill:#D3D1C7}
.p rect{fill:#3C3489;stroke:#AFA9EC}.p .t1{fill:#EEEDFE}.p .t2{fill:#CECBF6}
.g rect{fill:#085041;stroke:#5DCAA5}.g .t1{fill:#E1F5EE}.g .t2{fill:#9FE1CB}
.c rect{fill:#712B13;stroke:#F0997B}.c .t1{fill:#FAECE7}.c .t2{fill:#F5C4B3}
.n rect{fill:#444441;stroke:#B4B2A9}.n .t1{fill:#F1EFE8}.n .t2{fill:#D3D1C7}}
</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text class="f" x="120" y="34" text-anchor="middle">Compose(f, g) = f ; g</text><path class="w" d="M120 50 L120 80"/><text class="l" x="130" y="68" text-anchor="start">A</text><g class="p"><rect x="70" y="80" width="100" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="120.0" y="102.0" text-anchor="middle" dominant-baseline="central">f</text></g><path class="w" d="M120 124 L120 160"/><text class="l" x="130" y="146" text-anchor="start">B</text><g class="p"><rect x="70" y="160" width="100" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="120.0" y="182.0" text-anchor="middle" dominant-baseline="central">g</text></g><path class="w" d="M120 204 L120 240" marker-end="url(#a)"/><text class="l" x="130" y="228" text-anchor="start">C</text><text class="f" x="340" y="34" text-anchor="middle">Par(f, g) = Δ ; (f ⊗ g)</text><path class="w" d="M340 50 L340 76"/><text class="l" x="350" y="64" text-anchor="start">A</text><circle class="dot" cx="340" cy="80" r="4.5"/><path class="w" d="M336 82 C 310 92, 290 90, 290 110"/><path class="w" d="M344 82 C 370 92, 390 90, 390 110"/><g class="p"><rect x="250" y="110" width="80" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="290.0" y="132.0" text-anchor="middle" dominant-baseline="central">f</text></g><g class="p"><rect x="350" y="110" width="80" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="390.0" y="132.0" text-anchor="middle" dominant-baseline="central">g</text></g><path class="w" d="M290 154 L290 196" marker-end="url(#a)"/><path class="w" d="M390 154 L390 196" marker-end="url(#a)"/><text class="l" x="300" y="186" text-anchor="start">B</text><text class="l" x="400" y="186" text-anchor="start">C</text><text class="l" x="340" y="222" text-anchor="middle">Pair[B, C]</text><text class="f" x="560" y="34" text-anchor="middle">Sum(f, g) : A + B → C</text><path class="w" d="M560 50 L560 76"/><text class="l" x="570" y="64" text-anchor="start">Either[A, B]</text><g class="n"><rect x="510" y="76" width="100" height="36" rx="6" stroke-width="0.8"/><text class="t1" x="560.0" y="94.0" text-anchor="middle" dominant-baseline="central">Left or Right?</text></g><path class="w" d="M536 112 C 530 124, 510 124, 510 136"/><path class="w" d="M584 112 C 590 124, 610 124, 610 136"/><g class="p"><rect x="470" y="136" width="80" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="510.0" y="158.0" text-anchor="middle" dominant-baseline="central">f</text></g><g class="p"><rect x="570" y="136" width="80" height="44" rx="6" stroke-width="0.8"/><text class="t1" x="610.0" y="158.0" text-anchor="middle" dominant-baseline="central">g</text></g><path class="w" d="M510 180 C 510 200, 550 196, 556 214"/><path class="w" d="M610 180 C 610 200, 570 196, 564 214"/><path class="w" d="M560 214 L560 246" marker-end="url(#a)"/><text class="l" x="570" y="236" text-anchor="start">C</text><text class="f" x="340" y="300" text-anchor="middle">Laws (property-tested): (f ; g) ; h = f ; (g ; h) · id ; f = f = f ; id</text><text class="f" x="340" y="326" text-anchor="middle">Par(f, g) ; Fst = f · Left ; Sum(f, g) = f</text></svg>
